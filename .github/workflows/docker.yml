# Docker 재현성 검사
# push와 Pull Request마다 GitHub 서버에서 Docker 이미지를 새로 빌드하고 실행해 본다.
# 배지가 초록색이면 "누구의 PC에서든 Docker로 그대로 재현된다"는 뜻이다.
name: Docker 재현성 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions 탭에서 수동 실행

jobs:
  run-in-docker:
    name: 빌드 · 실행 · 데이터 유지 확인 (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 빌드
        run: docker build -t python-quiz-game .

      - name: 첫 실행 — 기본 퀴즈 8개로 시작하는지
        run: |
          printf '7\n' | docker run --rm -i -v quiz-ci:/data python-quiz-game | tee out1.txt
          grep -q "기본 퀴즈 8개로 시작합니다" out1.txt

      - name: 퀴즈 추가 → 새 컨테이너에서 데이터가 유지되는지
        run: |
          printf '2\nCI에서 추가한 문제\n가\n나\n다\n라\n1\n\n7\n' \
            | docker run --rm -i -v quiz-ci:/data python-quiz-game > /dev/null
          printf '7\n' | docker run --rm -i -v quiz-ci:/data python-quiz-game | tee out2.txt
          grep -q "퀴즈 9개" out2.txt

      - name: docker stop(SIGINT) 시 저장 후 정상 종료되는지
        run: |
          cid=$(docker run -d -it -v quiz-ci:/data python-quiz-game)
          sleep 2
          docker stop -t 10 "$cid"
          docker logs "$cid" | tee out3.txt
          grep -q "데이터를 저장하고 안전하게 종료합니다" out3.txt
          test "$(docker inspect "$cid" --format '{{.State.ExitCode}}')" = "0"

      - name: 최소 지원 버전(Python 3.10)으로 빌드·실행
        run: |
          docker build --build-arg PYTHON_VERSION=3.10 -t python-quiz-game:py3.10 .
          printf '7\n' | docker run --rm -i python-quiz-game:py3.10 | tee out4.txt
          grep -q "기본 퀴즈 8개로 시작합니다" out4.txt

      - name: Docker Compose로 실행
        run: |
          docker compose build
          printf '7\n' | docker compose run --rm -T quiz | tee out5.txt
          grep -q "게임을 종료합니다" out5.txt

  arm64:
    name: ARM(Apple Silicon 등) 빌드·실행 (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: arm64 이미지 빌드
        run: docker buildx build --platform linux/arm64 --load -t python-quiz-game:arm64 .

      - name: arm64 컨테이너 실행
        run: |
          printf '7\n' | docker run --rm -i --platform linux/arm64 python-quiz-game:arm64 | tee out.txt
          grep -q "기본 퀴즈 8개로 시작합니다" out.txt
